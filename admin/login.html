<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Portfolio Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#090d16',
            surface: '#0f172a',
            surfaceCard: '#131e33',
            borderSubtle: 'rgba(255, 255, 255, 0.08)'
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      background-color: #090d16;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .input-field {
      background: #090d16;
      border: 1px solid #334155;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #06b6d4;
      outline: none;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: 0.5rem;
      padding: 0.625rem 1rem;
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background: #0891b2;
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover {
      background: #06b6d4;
    }
    .btn-primary:focus-visible {
      outline: 2px solid #06b6d4;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="login-card w-full max-w-sm rounded-xl p-8">

    <!-- Logo & Header -->
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-lg bg-cyan-600 flex items-center justify-center text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div>
        <div class="text-sm font-bold tracking-wider text-white">PORTFOLIO ADMIN</div>
        <div class="text-[11px] text-slate-400 font-mono">Backend Data Manager</div>
      </div>
    </div>

    <h1 class="text-xl font-bold text-white mb-1">Masuk ke Dashboard</h1>
    <p class="text-xs text-slate-400 mb-6">Masukkan kredensial admin untuk mengakses panel kendali data.</p>

    <!--ERROR_PLACEHOLDER-->

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autocomplete="username"
          placeholder="Username"
          class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 font-mono focus-visible:ring-1 focus-visible:ring-cyan-500"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Password"
            class="input-field w-full rounded-lg px-3.5 py-2.5 pr-10 text-sm text-white placeholder-slate-500 font-mono focus-visible:ring-1 focus-visible:ring-cyan-500"
          />
          <button
            type="button"
            onclick="togglePasswordVisibility()"
            title="Tampilkan / sembunyikan password"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 p-1 rounded"
          >
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary w-full py-2.5 rounded-lg text-white font-bold text-sm mt-2 transition"
      >
        Masuk
      </button>
    </form>

    <p class="text-center text-[11px] text-slate-500 font-mono mt-8">portfolio-backend &copy; 2026</p>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
      } else {
        pwd.type = 'password';
      }
    }
  </script>
</body>
</html>
